[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "munexafs"
version = "0.1.0"
description = "STXM-NEXAFS data I/O and analysis application"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
gui = ["PySide6>=6.7", "pyqtgraph>=0.13"]
analysis = ["scipy>=1.12", "scikit-image>=0.22", "Pillow>=10.0"]
export = ["python-pptx>=0.6.23", "reportlab>=4.0", "matplotlib>=3.8"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
